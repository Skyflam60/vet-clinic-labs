# PostgreSQL 16 и Redis 7 для лабораторной работы №10 (база ветеринарной клиники vetdb)
# Запуск:           docker compose up -d
# Таблицы и данные: php bin/reset-db.php            500 000 приёмов для измерений: php bin/load-bigdata.php
# Консоль psql:     docker compose exec db psql -U postgres -d vetdb
# Консоль Redis:    docker compose exec redis redis-cli
# Если порт 5432 или 6379 занят (например, работает база из лабораторной работы №9 или установлен Redis),
# остановите их или запустите на других портах:  DB_PORT=5433 REDIS_PORT=6380 docker compose up -d
# и передайте те же порты приложению:  DB_PORT=5433 REDIS_PORT=6380 php -S localhost:8000 -t public
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: vetdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./sql:/sql
      - vetdata10:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  vetdata10:
