# PostgreSQL 16 для лабораторной работы №9: база ветеринарной клиники vetdb
# Запуск:        docker compose up -d
# Таблицы и данные:  php bin/reset-db.php
# Консоль psql:  docker compose exec db psql -U postgres -d vetdb
# Если порт 5432 занят (например, запущена база из лабораторной работы №8), остановите её командой
# docker compose down в папке lab8 или запустите эту базу на другом порту:  DB_PORT=5433 docker compose up -d
# и передайте тот же порт приложению:  DB_PORT=5433 php -S localhost:8000 -t public
# Отдельный том vetdata9: данные лабораторной работы №8 не затрагиваются.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: vetdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./sql:/sql
      - vetdata9:/var/lib/postgresql/data

volumes:
  vetdata9:
