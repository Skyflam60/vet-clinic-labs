<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Запись на приём</title><link rel="stylesheet" href="css/styles.css"></head><body>
<header><h1>Ветеринарная клиника</h1><p>Запись на приём. Учебная страница администратора.</p></header>
<section><h2>Новая запись</h2><form id="visit-form" novalidate>
<label>Животное <select id="animal" required></select></label>
<label>Причина обращения <input id="title" required minlength="3"></label><p id="form-error" class="error" role="alert"></p>
<label>Врач <input id="doctor" required></label><label>Дата и время <input id="date" type="datetime-local" required></label>
<button id="add" type="submit" disabled>Добавить в список</button></form></section>
<section><h2>Приёмы</h2><label>Статус <select id="status"><option value="">Все</option><option value="scheduled">Запланирован</option><option value="done">Завершён</option><option value="cancelled">Отменён</option></select></label>
<label>Поиск по причине или врачу <input id="search" type="search"></label><button id="load">Загрузить с сервера</button>
<p id="info" role="status"></p><p>Показано приёмов: <span id="count">0</span></p>
<table id="table" hidden><thead><tr><th>Животное</th><th>Причина</th><th>Врач</th><th>Дата и время</th><th>Статус</th><th>Действия</th></tr></thead><tbody id="rows"></tbody></table>
<p>Добавление, завершение и удаление меняют только список на странице. Повторная загрузка возвращает учебные данные.</p></section>
<script src="js/mock-data.js"></script><script src="js/mock-api.js"></script><script src="js/app.js"></script></body></html>
