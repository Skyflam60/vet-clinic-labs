# PostgreSQL 16 для лабораторной работы №8 (база ветеринарной клиники vetdb)
# Запуск:        docker compose up -d
# Консоль psql:  docker compose exec db psql -U postgres -d vetdb
# Отдельный том vetdata: если раньше запускался пример с базой taskdb,
# его том не мешает, и база vetdb создаётся заново.
# Папка sql/ видна внутри контейнера как /sql, поэтому в psql работает \i /sql/01_schema.sql
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: vetdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./sql:/sql
      - vetdata:/var/lib/postgresql/data

volumes:
  vetdata:
